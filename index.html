<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070b18">
  <title>NeoRead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      background: #070b18;
      color: #eef2ff;
      font-family: 'Syne', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      overflow: hidden;
    }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    input, textarea { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    #root {
      height: calc(var(--vh, 1vh) * 100);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-area { flex: 1; overflow: hidden; position: relative; }
    .tab-panel { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .tab-panel.hidden { display: none; }
    .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1; }

    .glass {
      background: rgba(255,255,255,.042);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 22px;
    }
    .grad {
      background: linear-gradient(130deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lbl { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(238,242,255,.28); }

    .prog-track { height: 3px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#38bdf8,#f472b6); transition: width .5s ease; }

    .inp {
      width: 100%;
      background: rgba(255,255,255,.042);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 16px;
      color: #eef2ff;
      outline: none;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    .inp:focus { border-color: rgba(56,189,248,.4); }
    .inp::placeholder { color: rgba(238,242,255,.2); }
    textarea.inp { resize: none; line-height: 1.6; }

    .btn-log {
      width: 100%; padding: 20px 0; border-radius: 20px;
      font-size: 18px; font-weight: 900; letter-spacing: 0.05em;
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.3);
      color: #38bdf8;
      box-shadow: 0 0 20px rgba(56,189,248,.15), inset 0 0 10px rgba(56,189,248,.05);
      transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-log:active { transform: scale(.96); background: rgba(56,189,248,.2); }
    .btn-logged {
      width: 100%; padding: 20px 0; border-radius: 20px;
      font-size: 16px; font-weight: 800; letter-spacing: 0.05em;
      background: rgba(255,255,255,.03);
      border: 1px dashed rgba(255,255,255,.15);
      color: rgba(238,242,255,.3);
      cursor: not-allowed;
    }
    .btn-grad {
      width: 100%; padding: 16px; border-radius: 18px;
      font-weight: 800; font-size: 14px; color: white;
      background: linear-gradient(130deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%);
      transition: transform .1s;
    }
    .btn-grad:active { transform: scale(.97); }
    .btn-ghost {
      width: 100%; padding: 12px 14px; border-radius: 14px;
      font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      color: rgba(238,242,255,.42);
    }
    .press { transition: transform .1s; }
    .press:active { transform: scale(.94); }

    .chip {
      display: inline-flex; align-items: center;
      padding: 5px 10px; border-radius: 9px;
      font-size: 11px; font-weight: 700; cursor: pointer;
      transition: transform .1s;
    }
    .chip:active { transform: scale(.92); }

    .modal-bg {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,.78);
      display: flex; align-items: flex-end;
    }
    .modal-bg.hidden { display: none; }
    .sheet {
      width: 100%;
      background: #0f1628;
      border: 1px solid rgba(255,255,255,.07);
      border-bottom: none;
      border-radius: 26px 26px 0 0;
      padding: 24px 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: slideUp .28s cubic-bezier(.34,1.56,.64,1);
    }

    .bottom-nav {
      flex-shrink: 0;
      background: rgba(7,11,24,.97);
      border-top: 1px solid rgba(255,255,255,.05);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1; padding: 9px 0 6px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      transition: opacity .2s;
      background: transparent;
      border: none;
    }
    .nav-btn span { font-size: 10px; font-weight: 700; }
    .nav-btn .dot { width: 4px; height: 4px; border-radius: 50%; background: #38bdf8; }
    .nav-btn.inactive { opacity: .4; }

    .cover { width: 46px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .cover-ph { width: 46px; height: 64px; border-radius: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

    .safe-top { padding-top: env(safe-area-inset-top); }

    /* === HEATMAP === */
    .hm-cell {
      width: 11px; height: 11px; border-radius: 2px;
      flex-shrink: 0;
    }

    /* === STAT CARD === */
    .stat-num {
      font-size: 36px; font-weight: 900; line-height: 1;
      background: linear-gradient(130deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .star-btn { cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .star-btn:active { transform: scale(0.9); }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }

    .anim-fadein { animation: fadeIn .2s ease-out; }
    hr.soft { border: none; border-top: 1px solid rgba(255,255,255,.055); margin: 14px 0; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>

<script>
'use strict';

const html = htm.bind(React.createElement);
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── MOBILE HEIGHT ── */
function setVh() {
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVh();
window.addEventListener('resize', setVh);
window.addEventListener('orientationchange', function() { setTimeout(setVh, 120); });

/* ── JST ── */
function jstISO() {
  var d = new Date(Date.now() + 9 * 3600 * 1000);
  return d.toISOString().slice(0, 10);
}

/* ── STREAK (リセットなし: 純粋な連続カウント) ──
   最新から遡って、途切れるまでの連続日数を返す
   ※ リセット廃止なので今日 or 昨日でなくても継続カウント */
function calcStreak(readDates) {
  if (!readDates || readDates.length === 0) return 0;
  var unique = {};
  for (var i = 0; i < readDates.length; i++) unique[readDates[i]] = true;
  var sorted = Object.keys(unique).sort().reverse();
  var streak = 1;
  for (var i = 1; i < sorted.length; i++) {
    var prev = new Date(sorted[i - 1] + 'T12:00:00Z');
    prev.setDate(prev.getDate() - 1);
    if (sorted[i] === prev.toISOString().slice(0, 10)) { streak++; } else { break; }
  }
  return streak;
}

/* ── 全体の達成率 ──
   初記録日から今日までの経過日数を分母とする
   例: 1/1が初記録、今日1/30 → 経過30日中、記録した日数 / 30
*/
function calcOverallRate(readDates) {
  var unique = {};
  (readDates || []).forEach(function(d) { unique[d] = true; });
  var dates = Object.keys(unique).sort();
  if (dates.length === 0) return { hit: 0, span: 0, rate: 0 };
  var first = new Date(dates[0] + 'T12:00:00Z');
  var today = new Date(jstISO() + 'T12:00:00Z');
  // 経過日数（初日も含むので +1）
  var span = Math.floor((today - first) / 86400000) + 1;
  if (span < 1) span = 1;
  var hit = dates.length;
  return { hit: hit, span: span, rate: Math.round(hit / span * 100) };
}

/* ── STORAGE ──
   キーはv3のまま維持（既存データを失わない）
   チャット・API関連フィールドは単に無視する
*/
const SK = 'neoread_v3';
const DEFS = {
  readDates: [],
  books: []
};

function loadData() {
  try {
    var cur = localStorage.getItem(SK);
    if (!cur) return Object.assign({}, DEFS);
    var parsed = JSON.parse(cur);
    return {
      readDates: parsed.readDates || [],
      books: parsed.books || []
    };
  } catch(e) { return Object.assign({}, DEFS); }
}
function saveData(d) {
  try { localStorage.setItem(SK, JSON.stringify(d)); scheduleAutoBackup(); } catch(e) {}
}

/* ── GASバックアップ ── */
function getNrGasUrl() { return localStorage.getItem('nr_gas_url') || ''; }
var _nrBkTimer = null, _nrLastBk = 0;
function scheduleAutoBackup() {
  if (_nrBkTimer) clearTimeout(_nrBkTimer);
  _nrBkTimer = setTimeout(function() {
    var url = getNrGasUrl(); if (!url) return;
    _nrLastBk = Date.now();
    var raw = localStorage.getItem(SK); if (!raw) return;
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: raw, redirect: 'follow' })
      .then(function(r) { return r.text(); })
      .then(function(t) { try { var j = JSON.parse(t); if (j.success) localStorage.setItem('nr_last_bk', new Date().toISOString()); } catch(e) {} })
      .catch(function() {});
  }, Math.max(0, 30000 - (Date.now() - _nrLastBk)));
}
function manualNrBackup() {
  var url = getNrGasUrl();
  if (!url) { alert('GAS URLが未設定です'); return; }
  var raw = localStorage.getItem(SK);
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: raw, redirect: 'follow' })
    .then(function(r) { return r.text(); })
    .then(function(t) { var j = JSON.parse(t); alert(j.success ? 'バックアップ完了！' : '失敗: ' + (j.error || '')); if (j.success) localStorage.setItem('nr_last_bk', new Date().toISOString()); })
    .catch(function(e) { alert('通信エラー: ' + e.message); });
}
function restoreNrFromSheets() {
  var url = getNrGasUrl();
  if (!url) { alert('GAS URLが未設定です'); return; }
  if (!confirm('スプシから復元します。現在のデータは上書きされます。')) return;
  fetch(url, { redirect: 'follow' })
    .then(function(r) { return r.text(); })
    .then(function(t) {
      var d = JSON.parse(t);
      if (!d.success) { alert('復元データなし: ' + (d.error || '')); return; }
      delete d.success;
      localStorage.setItem(SK, JSON.stringify(d));
      alert('復元完了！ リロードします');
      location.reload();
    })
    .catch(function(e) { alert('通信エラー: ' + e.message); });
}
function forceUpdateNr() {
  if ('caches' in window) {
    caches.keys().then(function(n) { return Promise.all(n.map(function(k) { return caches.delete(k); })); }).then(function() { location.reload(true); });
  } else { location.reload(true); }
}

/* ── Open Library ── */
function searchOL(q) {
  return fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q) + '&limit=6&fields=title,author_name,cover_i')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      return (d.docs || []).map(function(x) {
        return {
          title: x.title || '不明',
          author: (x.author_name || [])[0] || '不明',
          coverUrl: x.cover_i ? 'https://covers.openlibrary.org/b/id/' + x.cover_i + '-M.jpg' : null
        };
      });
    });
}

/* ── SVG Icons ── */
var SvgIcon = {
  Home: html`<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  Library: html`<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>`
};

/* ════════════════════════════════
   RECENT TIMELINE
   直近4日間（3日前→今日）を1本のタイムラインで表示
   各日タップでON/OFF切り替え
════════════════════════════════ */
function RecentTimeline(props) {
  var readDates = props.readDates;
  var onToggle  = props.onToggle;
  var _flashIso = useState(null);
  var flashIso = _flashIso[0], setFlashIso = _flashIso[1];

  // JST基準で今日〜3日前の4日分を生成（古い順）
  var todayBase = new Date(Date.now() + 9 * 3600 * 1000);
  todayBase.setUTCHours(0, 0, 0, 0);
  var dateSet = {};
  (readDates || []).forEach(function(d) { dateSet[d] = true; });

  var days = [];
  var WEEK = ['日','月','火','水','木','金','土'];
  for (var i = 3; i >= 0; i--) {
    var d = new Date(todayBase);
    d.setUTCDate(d.getUTCDate() - i);
    var iso = d.toISOString().slice(0, 10);
    days.push({
      iso: iso,
      hit: !!dateSet[iso],
      isToday: i === 0,
      monthDay: (d.getUTCMonth() + 1) + '/' + d.getUTCDate(),
      dow: WEEK[d.getUTCDay()]
    });
  }

  function handleTap(iso) {
    setFlashIso(iso);
    onToggle(iso);
    setTimeout(function() { setFlashIso(null); }, 350);
  }

  return html`
    <div style=${{ position: 'relative', padding: '12px 4px 6px' }}>
      <!-- 接続ライン（背景） -->
      <div style=${{
        position: 'absolute',
        top: '54px',
        left: '12%',
        right: '12%',
        height: '2px',
        background: 'rgba(255,255,255,.07)',
        zIndex: '0'
      }}></div>
      <!-- 接続ライン（達成部分のみハイライト） -->
      ${(function() {
        // 連続して達成している左端と右端を見つける
        var firstHit = -1, lastHit = -1;
        days.forEach(function(d, i) { if (d.hit) { if (firstHit < 0) firstHit = i; lastHit = i; } });
        if (firstHit < 0 || firstHit === lastHit) return null;
        // 4等分なので、各ノードの中心位置は 12.5%, 37.5%, 62.5%, 87.5%
        var centers = [12.5, 37.5, 62.5, 87.5];
        return html`
          <div style=${{
            position: 'absolute',
            top: '54px',
            left: centers[firstHit] + '%',
            width: (centers[lastHit] - centers[firstHit]) + '%',
            height: '2px',
            background: 'linear-gradient(90deg, #38bdf8, #818cf8)',
            boxShadow: '0 0 8px rgba(56,189,248,.5)',
            zIndex: '1'
          }}></div>
        `;
      })()}

      <!-- 4ノード -->
      <div style=${{ position: 'relative', zIndex: '2', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '4px' }}>
        ${days.map(function(d) {
          var isFlash = flashIso === d.iso;
          return html`
            <button key=${d.iso} onClick=${function() { handleTap(d.iso); }} style=${{
              background: 'transparent', border: 'none', padding: '4px 0',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px',
              cursor: 'pointer'
            }}>
              <!-- 日付ラベル -->
              <div style=${{ textAlign: 'center' }}>
                <div style=${{
                  fontSize: '11px',
                  fontWeight: '800',
                  color: d.isToday ? '#38bdf8' : 'rgba(238,242,255,.55)',
                  letterSpacing: '0.02em'
                }}>${d.monthDay}</div>
                <div style=${{
                  fontSize: '9px',
                  color: d.isToday ? 'rgba(56,189,248,.7)' : 'rgba(238,242,255,.3)',
                  fontWeight: '700',
                  marginTop: '1px'
                }}>${d.isToday ? 'TODAY' : d.dow}</div>
              </div>
              <!-- ノード（円） -->
              <div style=${{
                width: '28px', height: '28px', borderRadius: '50%',
                background: d.hit
                  ? 'linear-gradient(135deg, #38bdf8, #818cf8)'
                  : 'rgba(255,255,255,.04)',
                border: d.hit
                  ? 'none'
                  : d.isToday
                    ? '2px dashed rgba(56,189,248,.55)'
                    : '1.5px solid rgba(255,255,255,.12)',
                boxShadow: d.hit
                  ? '0 0 12px rgba(56,189,248,.5), inset 0 1px 0 rgba(255,255,255,.25)'
                  : 'none',
                transition: 'transform .15s, box-shadow .15s',
                transform: isFlash ? 'scale(1.25)' : 'scale(1)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: 'white', fontSize: '14px', fontWeight: '900'
              }}>
                ${d.hit ? '✓' : ''}
              </div>
              <!-- ステータスラベル -->
              <div style=${{
                fontSize: '9px',
                fontWeight: '700',
                color: d.hit ? '#38bdf8' : 'rgba(238,242,255,.25)'
              }}>${d.hit ? '記録済み' : '未記録'}</div>
            </button>
          `;
        })}
      </div>

      <p style=${{ fontSize: '10px', color: 'rgba(238,242,255,.3)', textAlign: 'center', marginTop: '14px' }}>
        💡 各日をタップして記録ON/OFF
      </p>
    </div>
  `;
}

/* ════════════════════════════════
   HOME TAB
════════════════════════════════ */
function HomeTab(props) {
  var data = props.data, onSettings = props.onSettings, onToggle = props.onToggle;

  var today = jstISO();
  var done = (data.readDates || []).indexOf(today) >= 0;
  var totalDays = useMemo(function() {
    var u = {}; (data.readDates || []).forEach(function(d) { u[d] = true; }); return Object.keys(u).length;
  }, [data.readDates]);
  var streak = useMemo(function() { return calcStreak(data.readDates); }, [data.readDates]);
  var overallStat = useMemo(function() { return calcOverallRate(data.readDates); }, [data.readDates]);

  var active = null;
  for (var i = 0; i < (data.books || []).length; i++) {
    if (data.books[i].status === 'reading') { active = data.books[i]; break; }
  }

  function handleToggle(iso) {
    var dates = data.readDates || [];
    var newDates = dates.indexOf(iso) >= 0
      ? dates.filter(function(d) { return d !== iso; })
      : dates.concat([iso]);
    onToggle(newDates);
  }

  // Logボタン用：今日を記録に追加（既に記録済みなら何もしない）
  var _flash = useState(false);
  var flash = _flash[0], setFlash = _flash[1];
  function tapLog() {
    if (done) return;
    setFlash(true);
    setTimeout(function() {
      setFlash(false);
      handleToggle(today);
    }, 440);
  }

  return html`
    <div className="tab-panel safe-top">
      ${flash && html`
        <div style=${{
          position: 'fixed', inset: '0', zIndex: '99', pointerEvents: 'none',
          background: 'linear-gradient(130deg,rgba(56,189,248,.42),rgba(244,114,182,.35))',
          animation: 'flash .44s ease-out forwards'
        }}></div>
      `}
      <!-- Header -->
      <div style=${{ padding: '12px 20px 8px', flexShrink: '0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <h1 className="grad" style=${{ fontSize: '28px', fontWeight: '900', letterSpacing: '-.5px', lineHeight: '1' }}>NeoRead</h1>
          <p style=${{ fontSize: '11px', color: 'rgba(56,189,248,.8)', marginTop: '4px', fontWeight: '800', letterSpacing: '0.05em' }}>1-Line Reading Log</p>
        </div>
        <button className="glass press" onClick=${onSettings} style=${{ width: '38px', height: '38px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '16px' }}>⚙️</button>
      </div>

      <div className="scroll" style=${{ padding: '4px 16px 32px' }}>

        <!-- Stats Dashboard -->
        <div className="glass" style=${{ padding: '16px 18px', marginBottom: '12px' }}>
          <p className="lbl" style=${{ marginBottom: '12px' }}>Dashboard</p>
          <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px' }}>
            <!-- 総達成日数 -->
            <div style=${{ textAlign: 'center', padding: '14px 8px', background: 'rgba(56,189,248,.06)', borderRadius: '14px', border: '1px solid rgba(56,189,248,.1)' }}>
              <div className="stat-num">${totalDays}</div>

              <div className="stat-num" style=${{ background: 'linear-gradient(130deg,#818cf8,#f472b6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>${streak}</div>
              <div className="lbl" style=${{ marginTop: '4px', fontSize: '9px' }}>連続日数</div>
            </div>
            <!-- 達成率（全体） -->
            <div style=${{ textAlign: 'center', padding: '14px 8px', background: 'rgba(244,114,182,.06)', borderRadius: '14px', border: '1px solid rgba(244,114,182,.1)' }}>
              <div className="stat-num" style=${{ background: 'linear-gradient(130deg,#f472b6,#fb923c)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text', fontSize: '28px' }}>${overallStat.rate}<span style=${{ fontSize: '16px' }}>%</span></div>
              <div className="lbl" style=${{ marginTop: '4px', fontSize: '9px' }}>達成率</div>
            </div>
          </div>
        </div>

        <!-- Recent Timeline Card -->
        <div className="glass" style=${{ padding: '16px 14px', marginBottom: '12px' }}>
          <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
            <span className="lbl">Recent 4 Days</span>
            <span style=${{ fontSize: '10px', color: 'rgba(238,242,255,.3)' }}>3日前 → 今日</span>
          </div>
          <${RecentTimeline} readDates=${data.readDates} onToggle=${handleToggle} />
        </div>

        <!-- Active Book -->
        ${active && html`
          <div className="glass" style=${{ padding: '14px 16px', marginBottom: '14px' }}>
            <p className="lbl" style=${{ marginBottom: '8px' }}>📖 読んでいる本</p>
            <div style=${{ display: 'flex', gap: '12px', alignItems: 'center' }}>
              ${active.coverUrl
                ? html`<img src=${active.coverUrl} className="cover" onError=${function(e) { e.target.style.display='none'; }} />`
                : html`<div className="cover-ph">📚</div>`}
              <div style=${{ flex: '1', minWidth: '0' }}>
                <p style=${{ fontWeight: '800', fontSize: '13px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${active.title}</p>
                <p style=${{ fontSize: '11px', color: 'rgba(238,242,255,.35)', marginTop: '2px' }}>${active.author || ''}</p>
                ${active.totalPages > 0 && html`
                  <div style=${{ marginTop: '8px' }}>
                    <div className="prog-track">
                      <div className="prog-fill" style=${{ width: Math.min(100, Math.round((active.currentPage||0)/active.totalPages*100)) + '%' }}></div>
                    </div>
                    <p style=${{ fontSize: '10px', color: 'rgba(238,242,255,.22)', marginTop: '3px' }}>p.${active.currentPage||0} / ${active.totalPages}</p>
                  </div>
                `}
              </div>
            </div>
          </div>
        `}

        <!-- CTA Logボタン -->
        <button onClick=${tapLog} disabled=${done} className=${done ? 'btn-logged' : 'btn-log'}>
          ${done ? '🔒 Today Logged ✓' : '⚡️ Log Today\'s Reading'}
        </button>
      </div>
    </div>
  `;
}

/* ════════════════════════════════
   ARCHIVE TAB
════════════════════════════════ */
function ArchiveTab(props) {
  var data = props.data, onBooks = props.onBooks;
  var _tab     = useState('reading'); var tab = _tab[0], setTab = _tab[1];
  var _addM    = useState(false);     var addM = _addM[0], setAdd = _addM[1];
  var _manM    = useState(false);     var manM = _manM[0], setMan = _manM[1];
  var _memoM   = useState(null);      var memoM = _memoM[0], setMemoM = _memoM[1];
  var _q       = useState('');        var q = _q[0], setQ = _q[1];
  var _results = useState([]);        var results = _results[0], setRes = _results[1];
  var _srch    = useState(false);     var srch = _srch[0], setSrch = _srch[1];
  var _memoTxt = useState('');        var memoTxt = _memoTxt[0], setMemoTxt = _memoTxt[1];
  var _memoPg  = useState('');        var memoPg = _memoPg[0], setMemoPg = _memoPg[1];
  var _mTitle  = useState('');        var mTitle = _mTitle[0], setMTitle = _mTitle[1];
  var _mMotive = useState('');        var mMotive = _mMotive[0], setMMotive = _mMotive[1];
  var _mCover  = useState('');        var mCover = _mCover[0], setMCover = _mCover[1];
  var _editM   = useState(null);      var editM = _editM[0], setEditM = _editM[1];
  var _eTitle  = useState('');        var eTitle = _eTitle[0], setETitle = _eTitle[1];
  var _eAuthor = useState('');        var eAuthor = _eAuthor[0], setEAuthor = _eAuthor[1];
  var _eMotive = useState('');        var eMotive = _eMotive[0], setEMotive = _eMotive[1];
  var _eCover  = useState('');        var eCover = _eCover[0], setECover = _eCover[1];
  var _eReview = useState('');        var eReview = _eReview[0], setEReview = _eReview[1];
  var _eStar   = useState(0);         var eStar = _eStar[0], setEStar = _eStar[1];
  var _rateM   = useState(null);      var rateM = _rateM[0], setRateM = _rateM[1];
  var _rStar   = useState(0);         var rStar = _rStar[0], setRStar = _rStar[1];
  var _rText   = useState('');        var rText = _rText[0], setRText = _rText[1];

  var books = data.books || [];
  var reading = books.filter(function(b) { return b.status === 'reading'; });
  var queue   = books.filter(function(b) { return b.status === 'queue'; });
  var done    = books.filter(function(b) { return b.status === 'done'; });

  function doSearch() {
    if (!q.trim()) return;
    setSrch(true); setRes([]);
    searchOL(q).then(function(r) { setRes(r); setSrch(false); }).catch(function() { setRes([]); setSrch(false); });
  }
  function addBook(info, status) {
    onBooks(books.concat([Object.assign({ id: String(Date.now()), status: status, currentPage: 0, totalPages: null, memos: [], addedAt: jstISO() }, info)]));
    setAdd(false); setMan(false); setQ(''); setRes([]); setMTitle(''); setMMotive(''); setMCover('');
  }
  function upBook(id, u) { onBooks(books.map(function(b) { return b.id === id ? Object.assign({}, b, u) : b; })); }
  function delBook(id) { if (confirm('この本を削除しますか？')) onBooks(books.filter(function(b) { return b.id !== id; })); }
  function saveMemo(bookId) {
    if (!memoTxt.trim()) return;
    var bk = books.find(function(b) { return b.id === bookId; });
    upBook(bookId, { memos: (bk ? bk.memos || [] : []).concat([{ id: String(Date.now()), text: memoTxt, page: memoPg, date: jstISO() }]) });
    setMemoTxt(''); setMemoPg(''); setMemoM(null);
  }

  function StarRating(srProps) {
    return html`
      <div style=${{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
        ${[1,2,3,4,5].map(function(s) {
          var f = s <= srProps.value;
          return html`
            <svg key=${s} onClick=${function() { srProps.onChange(s); }} className="star-btn" width="32" height="32" viewBox="0 0 24 24"
              fill=${f ? '#fbbf24' : 'none'} stroke=${f ? '#fbbf24' : 'rgba(255,255,255,.2)'} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>`;
        })}
      </div>`;
  }

  var listMap = { reading: reading, queue: queue, done: done };
  var list = listMap[tab] || [];

  function BookCard(bkProps) {
    var bk = bkProps.bk;
    var recentMemos = (bk.memos || []).slice(-2);
    return html`
      <div className="glass anim-fadein" style=${{ padding: '16px', marginBottom: '12px' }}>
        <div style=${{ display: 'flex', gap: '12px' }}>

            ${bk.motive && html`<p style=${{ fontSize: '11px', color: 'rgba(238,242,255,.6)', marginTop: '6px', lineHeight: '1.4', padding: '6px', background: 'rgba(255,255,255,.05)', borderLeft: '2px solid #38bdf8', borderRadius: '0 4px 4px 0' }}>💡 ${bk.motive}</p>`}
            ${(bk.review || bk.rating) && html`

                    <svg key=${s} width="14" height="14" viewBox="0 0 24 24" fill=${f?'#fbbf24':'none'} stroke=${f?'#fbbf24':'rgba(255,255,255,.2)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>`;})}
                </div>`}
                ${bk.review && html`<p style=${{ fontSize: '12px', color: 'rgba(238,242,255,.8)', lineHeight: '1.5' }}>${bk.review}</p>`}
              </div>
            `}
            ${bk.status === 'reading' && html`
              <div style=${{ display: 'flex', gap: '6px', alignItems: 'center', marginTop: '8px', marginBottom: '6px' }}>
                <input type="number" value=${bk.currentPage||''} onInput=${function(e){upBook(bk.id,{currentPage:parseInt(e.target.value)||0});}}

                <span style=${{ color:'rgba(238,242,255,.2)',fontSize:'11px' }}>/</span>

                  placeholder="総ページ" className="inp" style=${{ width:'90px', padding:'6px 10px', fontSize:'12px' }} />
              </div>
            `}
            ${bk.status === 'reading' && bk.totalPages > 0 && html`
              <div style=${{ marginBottom: '6px' }}>
                <div className="prog-track"><div className="prog-fill" style=${{ width: Math.min(100,Math.round((bk.currentPage||0)/bk.totalPages*100))+'%' }}></div></div>
                <p style=${{ fontSize:'10px', color:'rgba(238,242,255,.2)', marginTop:'3px' }}>${Math.min(100,Math.round((bk.currentPage||0)/bk.totalPages*100))}%</p>
              </div>
            `}
            ${recentMemos.map(function(m) { return html`
              <div key=${m.id} style=${{ borderLeft:'2px solid rgba(56,189,248,.25)', paddingLeft:'8px', marginBottom:'5px' }}>
                <p style=${{ fontSize:'11px', color:'rgba(238,242,255,.45)', lineHeight:'1.5' }}>
                  ${m.page && html`<span style=${{ color:'rgba(56,189,248,.5)',marginRight:'5px' }}>p.${m.page}</span>`}${m.text}
                </p>
              </div>
            `;})}
            ${bk.memos && bk.memos.length > 2 && html`<p style=${{ fontSize:'10px', color:'rgba(238,242,255,.2)', marginBottom:'4px' }}>+${bk.memos.length-2} 件のメモ</p>`}
            <div style=${{ display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'8px' }}>
              <span className="chip press" onClick=${function(){setMemoM(bk.id);}} style=${{ background:'rgba(56,189,248,.12)',color:'#38bdf8' }}>📝 メモ</span>
              <span className="chip press" onClick=${function(){setETitle(bk.title||'');setEAuthor(bk.author||'');setEMotive(bk.motive||'');setECover(bk.coverUrl||'');setEReview(bk.review||'');setEStar(bk.rating||0);setEditM(bk.id);}} style=${{ background:'rgba(255,255,255,.08)',color:'rgba(238,242,255,.6)' }}>⚙️ 編集</span>
              ${bk.status==='reading' && html`<span className="chip press" onClick=${function(){setRStar(bk.rating||0);setRText(bk.review||'');setRateM(bk.id);}} style=${{ background:'rgba(129,140,248,.12)',color:'#818cf8' }}>✅ 読了</span>`}
              ${bk.status==='queue'   && html`<span className="chip press" onClick=${function(){upBook(bk.id,{status:'reading'});}} style=${{ background:'rgba(56,189,248,.12)',color:'#38bdf8' }}>📖 読む</span>`}
              ${bk.status==='done'    && html`<span className="chip press" onClick=${function(){upBook(bk.id,{status:'reading'});}} style=${{ background:'rgba(56,189,248,.12)',color:'#38bdf8' }}>↩ 再読</span>`}
              <span className="chip press" onClick=${function(){delBook(bk.id);}} style=${{ background:'rgba(255,255,255,.04)',color:'rgba(238,242,255,.25)' }}>🗑</span>

                <div style=${{ flex:'1', minWidth:'0' }}>

                  <span className="chip press" onClick=${function(){addBook(bk,'queue');}} style=${{ background:'rgba(129,140,248,.18)',color:'#818cf8',fontSize:'11px' }}>積読</span>

            <button onClick=${function(){setMTitle(q);setMan(true);setAdd(false);}} className="btn-ghost">📝 手動で追加（日本語書籍・URLで書影登録）</button>

        <div className="modal-bg" onClick=${function(){setRateM(null);}}>
          <div className="sheet" onClick=${function(e){e.stopPropagation();}}>
            <h3 style=${{ fontWeight:'900', fontSize:'16px', marginBottom:'14px', textAlign:'center' }}>✅ 読了おめでとうございます</h3>
            <div style=${{ marginBottom:'20px' }}><${StarRating} value=${rStar} onChange=${setRStar} /></div>
            <textarea value=${rText} onInput=${function(e){setRText(e.target.value);}} placeholder="この本から得た最大の学びや感想..." rows="3" className="inp" style=${{ marginBottom:'16px' }}></textarea>
            <button onClick=${function(){upBook(rateM,{status:'done',rating:rStar,review:rText});setRateM(null);}} className="btn-grad">読了として保存</button>
            <div style=${{ height:'8px' }}></div>
          </div>
        </div>
      `}
    </div>
  `;
}

/* ════════════════════════════════
   SETTINGS MODAL
════════════════════════════════ */
function SettingsModal(props) {
  var data = props.data, onUpdate = props.onUpdate, onClose = props.onClose;
  var _gasInp = useState(getNrGasUrl()); var gasInp = _gasInp[0], setGasInp = _gasInp[1];
  var lbk = localStorage.getItem('nr_last_bk');
  var lbkStr = lbk ? new Date(lbk).toLocaleString('ja-JP') : 'なし';

  return html`
    <div className="modal-bg" style=${{ zIndex:'90' }} onClick=${onClose}>
      <div className="sheet" onClick=${function(e){e.stopPropagation();}}>
        <h3 style=${{ fontWeight:'900', fontSize:'16px', marginBottom:'18px' }}>⚙️ 設定</h3>

        <!-- アプリ更新 -->
        <div className="glass" style=${{ padding:'16px', marginBottom:'14px', borderRadius:'18px' }}>
          <p style=${{ fontSize:'12px', fontWeight:'800', color:'#38bdf8', marginBottom:'6px' }}>🔄 アプリを最新版に更新</p>
          <button onClick=${forceUpdateNr} className="btn-ghost" style=${{ background:'rgba(56,189,248,.08)',color:'#38bdf8',border:'none',fontWeight:'700' }}>更新を確認する</button>
        </div>

        <!-- スプシバックアップ -->
        <div className="glass" style=${{ padding:'16px', marginBottom:'14px', borderRadius:'18px', border:'1px solid rgba(56,189,248,.15)' }}>
          <p style=${{ fontSize:'12px', fontWeight:'800', color:'#38bdf8', marginBottom:'4px' }}>☁️ スプシ自動バックアップ</p>
          <p style=${{ fontSize:'11px', color:'rgba(238,242,255,.45)', lineHeight:'1.5', marginBottom:'12px' }}>データ変更から30秒後に自動バックアップ。</p>
          <input value=${gasInp} onInput=${function(e){setGasInp(e.target.value);}} placeholder="https://script.google.com/macros/s/..." className="inp" style=${{ fontSize:'12px', marginBottom:'10px' }} />
          <button onClick=${function(){localStorage.setItem('nr_gas_url',gasInp.trim());alert(gasInp.trim()?'URLを保存しました':'URLをクリアしました');}} className="btn-ghost" style=${{ marginBottom:'8px',fontWeight:'700' }}>💾 URLを保存</button>
          <div style=${{ display:'flex', gap:'8px', marginBottom:'8px' }}>
            <button onClick=${manualNrBackup} className="btn-ghost" style=${{ flex:'1',fontSize:'12px' }}>📤 今すぐバックアップ</button>
            <button onClick=${restoreNrFromSheets} className="btn-ghost" style=${{ flex:'1',fontSize:'12px' }}>📥 復元</button>
          </div>
          <p style=${{ fontSize:'10px', color:'rgba(238,242,255,.2)' }}>最終バックアップ: ${lbkStr}</p>
        </div>

        <!-- データ管理 -->
        <p className="lbl" style=${{ marginBottom:'8px' }}>データ管理</p>
        <button onClick=${function(){
          if(confirm('全データをリセットしますか？\nこの操作は取り消せません。')) {
            onUpdate({readDates:[],books:[]});onClose();
          }
        }} className="press" style=${{
          width:'100%', padding:'13px', borderRadius:'16px', marginBottom:'16px',
          background:'rgba(244,114,182,.08)', border:'1px solid rgba(244,114,182,.18)',
          color:'#f472b6', fontWeight:'700', fontSize:'13px'
        }}>全データをリセット</button>
        <button onClick=${onClose} className="btn-grad">閉じる</button>
        <div style=${{ height:'8px' }}></div>
      </div>
    </div>
  `;
}

/* ════════════════════════════════
   APP ROOT
════════════════════════════════ */
function App() {
  var _data = useState(function() { return loadData(); });
  var data = _data[0], setData = _data[1];
  var _tab = useState('home'); var tab = _tab[0], setTab = _tab[1];
  var _cfg = useState(false);  var cfg = _cfg[0], setCfg = _cfg[1];

  useEffect(function() { saveData(data); }, [data]);

  var patch = useCallback(function(u) {
    setData(function(p) { return Object.assign({}, p, u); });
  }, []);

  var TABS = [
    { id: 'home',    e: SvgIcon.Home,    l: 'ホーム' },
    { id: 'archive', e: SvgIcon.Library, l: '本棚'   }
  ];

  return html`
    <div style=${{ height:'100%', display:'flex', flexDirection:'column', background:'#070b18' }}>
      <div style=${{ flex:'1', overflow:'hidden', position:'relative' }}>
        ${TABS.map(function(t) { return html`
          <div key=${t.id} style=${{ position:'absolute', inset:'0', display: tab===t.id ? 'flex' : 'none', flexDirection:'column' }}>
            ${t.id==='home'    && html`<${HomeTab}    data=${data} onSettings=${function(){setCfg(true);}} onToggle=${function(newDates){patch({readDates:newDates});}} />`}
            ${t.id==='archive' && html`<${ArchiveTab} data=${data} onBooks=${function(b){patch({books:b});}} />`}
          </div>
        `;})}
      </div>

      <div className="bottom-nav">
        ${TABS.map(function(t) {
          var active = tab===t.id;
          return html`
            <button key=${t.id} onClick=${function(){setTab(t.id);}} className=${'nav-btn press'+(active?'':' inactive')}>
              <span style=${{ display:'flex', alignItems:'center', justifyContent:'center', width:'22px', height:'22px', marginBottom:'2px', color: active ? '#38bdf8' : 'rgba(238,242,255,.4)' }}>${t.e}</span>
              <span style=${{ color: active ? '#38bdf8' : 'rgba(238,242,255,.6)' }}>${t.l}</span>
              ${active && html`<div className="dot"></div>`}
            </button>
          `;
        })}
      </div>

      ${cfg && html`<${SettingsModal} data=${data} onUpdate=${patch} onClose=${function(){setCfg(false);}} />`}
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
